version: 2

updates:
  - package-ecosystem: maven
    directory: /release
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /release
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
