# Same source-deploy / Workload Identity Federation pattern as jalaops.
name: Deploy Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'scripts/deploy-cloud-run.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor_id == '4532255' &&
      github.triggering_actor == 'jussipalanen' &&
      vars.GCP_PROJECT_ID != '' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Run
    needs: ci
    # Check again when rerunning only this job after a successful CI job.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor_id == '4532255' &&
      github.triggering_actor == 'jussipalanen'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build and deploy
        run: bash scripts/deploy-cloud-run.sh --quiet
