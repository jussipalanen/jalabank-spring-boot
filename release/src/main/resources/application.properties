spring.application.name=jalabank

# Render (and many other hosts) tell the app which port to use through PORT
server.port=${PORT:8080}

# Only the health endpoint is public; used by Docker and Render health checks
management.endpoints.web.exposure.include=health

# API errors as RFC 9457 problem details (JSON)
spring.mvc.problemdetails.enabled=true

# OpenAPI description at /v3/api-docs, Swagger UI at /docs.
# Lists the REST API and the actuator health check.
springdoc.show-actuator=true
springdoc.paths-to-match=/api/**,/actuator/health/**
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list

# The session cookie (sign-in) is not sent with requests from other sites
server.servlet.session.cookie.same-site=lax
