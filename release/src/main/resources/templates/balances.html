<!DOCTYPE html>
<!-- To use thymeleaf -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments/header :: head}"></head>

<body>
    <div th:replace="~{fragments/navigation :: navigation}"></div>
    <div class="container">
        <div class="row mt-3">
            <div class="col">
                <h2>Balances</h2>
                <p>
                    This lists the transactions of a month, shows the balance at the end of the month, and the
                    cumulative balance after each transaction.
                </p>
                <a th:replace="~{fragments/back :: back}"></a>
                <form method="GET">
                    <div class="row mb-3 mt-3">
                        <div class="col">
                            <label for="year" class="form-label">Year:</label>
                            <select class="form-select" name="year" id="year">
                                <option th:each="yearVal: ${years}" th:selected="${year == yearVal}"
                                    th:value="${yearVal}" th:text="${yearVal}"></option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="month" class="form-label">Month:</label>
                            <select class="form-select" name="month" id="month">
                                <option th:each="monthItem: ${months}" th:selected="${month == monthItem.number}"
                                    th:value="${monthItem.number}" th:text="${monthItem.name}"></option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="size" class="form-label">Show:</label>
                            <select class="form-select" name="size" id="size">
                                <option th:each="sizeVal: ${pageSizes}" th:selected="${size == sizeVal}"
                                    th:value="${sizeVal}" th:text="${sizeVal}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="submit" class="btn btn-primary" value="Search">
                        </div>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Transaction ID</th>
                                <th scope="col" class="text-end">Amount</th>
                                <th scope="col">Date</th>
                                <th scope="col">Message</th>
                                <th scope="col" class="text-end">Cumulative balance</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${transactions.totalElements == 0}">
                                <td colspan="5" class="text-body-secondary">No transactions in this month.</td>
                            </tr>
                            <tr th:each="row: ${transactions.content}">
                                <th scope="row" class="font-monospace small" th:text="${row.id}"></th>
                                <td class="text-end" th:classappend="${row.amount.signum() >= 0 ? 'text-success' : 'text-danger'}"
                                    th:text="${@money.format(row.amount)}"></td>
                                <td th:text="${#temporals.format(row.date, 'dd.MM.yyyy')}"></td>
                                <td th:text="${row.message}"></td>
                                <td class="text-end text-primary" th:text="${@money.format(row.cumulativeBalance)}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="mt-3" th:if="${transactions.totalPages > 1}" aria-label="Pages">
                    <ul class="pagination flex-wrap">
                        <li class="page-item" th:each="pageNumber : ${transactions.pageNumbers}"
                            th:classappend="${pageNumber == transactions.number + 1} ? active">
                            <a class="page-link"
                                th:href="@{/balances(page=${pageNumber}, size=${size}, month=${month}, year=${year})}"
                                th:text="${pageNumber}"></a>
                        </li>
                    </ul>
                </nav>

                <div class="row mt-3">
                    <div class="col">
                        <p>
                            Month balance: <b th:text="${@money.format(monthBalance)}"></b>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
