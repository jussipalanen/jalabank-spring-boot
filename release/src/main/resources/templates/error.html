<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">

<head th:replace="~{fragments/header :: head('Error')}"></head>

<body>
    <nav th:replace="~{fragments/navigation :: navigation('')}"></nav>
    <main class="container py-5">
        <div class="card mx-auto" style="max-width: 32rem">
            <div class="card-body p-4 text-center">
                <h1 class="h3" th:text="|Error ${status}|">Error</h1>
                <p class="text-body-secondary" th:text="${error}"></p>
                <a th:href="@{/}" class="btn btn-primary">Back to dashboard</a>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
