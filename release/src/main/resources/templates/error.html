<!DOCTYPE html>
<!-- To use thymeleaf -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments/header :: head}"></head>

<body>
    <div th:replace="~{fragments/navigation :: navigation}"></div>
    <div class="container">
        <div class="row mt-3">
            <div class="col">
                <h2 th:text="|Error ${status}|">Error</h2>
                <p th:text="${error}"></p>
                <a th:replace="~{fragments/back :: back}"></a>
            </div>
        </div>
    </div>
</body>

</html>
