<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">

<head th:replace="~{fragments/header :: head('Add transaction')}"></head>

<body>
    <nav th:replace="~{fragments/navigation :: navigation('transaction')}"></nav>
    <main class="container py-4">
        <div class="mb-4">
            <a th:replace="~{fragments/back :: back}"></a>
            <h1 class="h3 mt-2 mb-0">Add transaction</h1>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form th:action="@{/transaction}" th:object="${transaction}" method="post">

                    <div class="alert alert-warning" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

                    <div class="row g-4">
                        <div class="col-lg-6">
                            <div class="mb-3">
                                <label for="customerId" class="form-label">Customer</label>
                                <select class="form-select" th:field="*{customerId}" th:errorclass="is-invalid">
                                    <option th:each="c : ${customers}" th:value="${c.id}"
                                        th:text="|${c.fullName} (${c.email})|"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{customerId}"></div>
                            </div>

                            <div class="mb-3">
                                <span class="form-label d-block">Type</span>
                                <div class="btn-group w-100" role="group" aria-label="Transfer method">
                                    <input type="radio" class="btn-check" th:field="*{transferMethod}" value="DEPOSIT" id="method-deposit">
                                    <label class="btn btn-outline-success" for="method-deposit">Deposit</label>
                                    <input type="radio" class="btn-check" th:field="*{transferMethod}" value="WITHDRAW" id="method-withdraw">
                                    <label class="btn btn-outline-danger" for="method-withdraw">Withdraw</label>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label for="amount" class="form-label">Amount (€)</label>
                                    <input class="form-control" type="number" min="0.01" max="9999999" step="0.01"
                                        th:field="*{amount}" th:errorclass="is-invalid" placeholder="0.00" required>
                                    <div class="invalid-feedback" th:errors="*{amount}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="date" class="form-label">Date</label>
                                    <input type="date" class="form-control" th:field="*{date}" th:errorclass="is-invalid" required>
                                    <div class="invalid-feedback" th:errors="*{date}"></div>
                                    <div class="form-text">A future date makes it a scheduled transaction.</div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6 d-flex flex-column">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control flex-grow-1" rows="6" maxlength="255" th:field="*{message}"
                                th:errorclass="is-invalid" placeholder="What is it for?"></textarea>
                            <div class="invalid-feedback" th:errors="*{message}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4">Save transaction</button>
                        <button type="reset" class="btn btn-outline-light">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
