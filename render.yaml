# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates one Docker web service. No database is needed, the app runs on in-memory demo data.
services:
  - type: web
    name: jalabank
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./release/Dockerfile
    dockerContext: ./release
    healthCheckPath: /actuator/health
    # Needs a CNAME record jalabank-demo -> jalabank.onrender.com at the DNS provider
    domains:
      - jalabank-demo.jussialanen.com
    buildFilter:
      paths:
        - release/**
